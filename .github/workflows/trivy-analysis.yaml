name: Trivy Analysis

permissions:
  contents: read
  actions: read
  security-events: write

on:
  pull_request:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 1 */3 *'

env:
  SARIF_FILE: 'trivy-results.sarif'

jobs:
  build:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner on the cloned repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.73.0'
          scan-type: 'fs'
          scanners: 'vuln,misconfig,secret,license'
          trivyignores: '.trivyignore.yaml'
          ignore-unfixed: true
          format: 'sarif'
          output: ${{ env.SARIF_FILE }}
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Check Trivy scan results existence
        run: |
          if [ ! -f "${{ env.SARIF_FILE }}" ]; then
            echo "Error: ${{ env.SARIF_FILE }} does not exist."
            exit 1
          fi
          ls -lash ${{ env.SARIF_FILE }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
        with:
          sarif_file: ${{ env.SARIF_FILE }}
